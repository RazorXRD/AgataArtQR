<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta de Dedicatoria ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
  :root {
    --rose: #c0392b;
    --blush: #f9e4e4;
    --gold: #b8860b;
    --cream: #fdf6f0;
    --dark: #2c1a1a;
    --petal: #e8a0a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 30px 16px 60px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 2px;
    box-shadow: 0 8px 40px rgba(0,0,0,.15), 0 2px 8px rgba(0,0,0,.08);
    overflow: hidden;
    animation: fadeIn .8s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .card::before {
    content: '';
    display: block;
    height: 6px;
    background: linear-gradient(90deg, var(--rose), var(--gold), var(--rose));
  }

  .photo-section {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: linear-gradient(135deg, #f9e4e4, #fce4ec);
    display: none;
  }
  .photo-section.has-photo { display: block; }
  .photo-section img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  .card-body { padding: 28px 28px 24px; }

  .ornament {
    text-align: center;
    color: var(--rose);
    font-size: 22px;
    letter-spacing: 6px;
    margin-bottom: 16px;
  }

  .to-name {
    font-family: 'Dancing Script', cursive;
    font-size: 32px;
    color: var(--rose);
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.2;
  }

  .dedication-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-style: italic;
    line-height: 1.8;
    color: #4a3030;
    text-align: justify;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .from-line {
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    color: var(--gold);
    text-align: right;
    margin-top: 22px;
  }

  .music-section {
    margin: 20px 28px 0;
    padding: 14px 18px;
    background: linear-gradient(135deg, #fff0f0, #fff8f0);
    border-radius: 50px;
    border: 1px solid #f0d0d0;
    display: none;
    align-items: center;
    gap: 14px;
  }
  .music-section.visible { display: flex; }

  .play-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--rose);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform .2s, background .2s;
  }
  .play-btn:hover { transform: scale(1.08); background: #a93226; }
  .play-btn svg { margin-left: 2px; }

  .song-info { flex: 1; min-width: 0; }
  .song-title-display {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-wrap {
    height: 3px;
    background: #f0d0d0;
    border-radius: 3px;
    margin-top: 6px;
    cursor: pointer;
  }
  .progress-bar {
    height: 100%;
    background: var(--rose);
    border-radius: 3px;
    width: 0%;
    transition: width .5s linear;
  }
  .song-sub { font-size: 11px; color: #999; margin-top: 2px; }

  audio { display: none; }

  .card-footer {
    padding: 18px 28px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #c0a0a0;
    font-size: 12px;
    letter-spacing: 2px;
  }
  .heart-footer { color: var(--rose); font-size: 14px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

  /* Error state */
  .error-state {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    display: none;
  }
  .error-state.visible { display: block; }
  .error-state h2 { font-family: 'Playfair Display', serif; color: var(--rose); margin-bottom: 12px; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--petal);
    font-size: 32px;
    letter-spacing: 8px;
    animation: pulse 1.5s infinite;
  }

  /* Tap to open overlay (enables autoplay) */
  .open-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, var(--cream), var(--blush));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .open-overlay .heart-big {
    font-size: 56px;
    color: var(--rose);
    animation: pulse 1.4s infinite;
    margin-bottom: 20px;
  }
  .open-overlay h2 {
    font-family: 'Playfair Display', serif;
    color: var(--rose);
    font-size: 24px;
    margin-bottom: 10px;
  }
  .open-overlay p {
    color: #b08080;
    font-size: 14px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="loading" class="loading">❤</div>
<div id="openOverlay" class="open-overlay" style="display:none" onclick="openCard()">
  <div class="heart-big">❤</div>
  <h2>Tienes una carta especial</h2>
  <p>Toca para abrirla ✦</p>
</div>
<div id="card" class="card" style="display:none">
  <div class="photo-section" id="photoSection">
    <img id="cardPhoto" src="" alt="">
  </div>
  <div class="card-body">
    <div class="ornament">✦ ❤ ✦</div>
    <div class="to-name" id="cardTo"></div>
    <div class="dedication-text" id="cardText"></div>
    <div class="from-line" id="cardFrom"></div>
  </div>
  <div class="music-section" id="musicSection">
    <button class="play-btn" onclick="togglePlay()">
      <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <div class="song-info">
      <div class="song-title-display" id="songTitleDisplay">Canción especial</div>
      <div class="progress-wrap" onclick="seekAudio(event)">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="song-sub" id="songTime">0:00</div>
    </div>
    <audio id="audioPlayer" onended="resetPlay()" ontimeupdate="updateProgress()"></audio>
  </div>
  <div class="card-footer">
    <span class="heart-footer">❤</span>
    <span>Con todo mi amor</span>
    <span class="heart-footer">❤</span>
  </div>
</div>
<div id="errorState" class="error-state">
  <h2>❤ Oops...</h2>
  <p>No se encontró ninguna postal en este enlace.<br>Puede que el enlace esté incompleto.</p>
</div>

<script>
// ===== LOAD POSTAL FROM URL =====
let postalData = null;

window.addEventListener('load', function() {
  const hash = window.location.hash.slice(1);
  const params = new URLSearchParams(window.location.search);
  const encoded = hash || params.get('d');

  setTimeout(function() {
    document.getElementById('loading').style.display = 'none';

    if (!encoded) {
      document.getElementById('errorState').classList.add('visible');
      return;
    }

    try {
      const json = LZString.decompressFromEncodedURIComponent(encoded);
      postalData = JSON.parse(json);
      renderPostal(postalData);
      // Show "tap to open" overlay first (enables autoplay on tap)
      document.getElementById('openOverlay').style.display = 'flex';
    } catch(e) {
      document.getElementById('errorState').classList.add('visible');
    }
  }, 600);
});

function openCard() {
  document.getElementById('openOverlay').style.display = 'none';
  document.getElementById('card').style.display = 'block';

  // Try to autoplay music after user interaction
  if (postalData && postalData.songData) {
    const audio = document.getElementById('audioPlayer');
    audio.play().then(() => {
      playing = true;
      document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    }).catch(() => {
      // Autoplay blocked, user can press play manually
    });
  }
}

function renderPostal(d) {
  document.title = d.to ? `Para ${d.to} ❤️` : 'Carta de Dedicatoria ❤️';
  document.getElementById('cardTo').textContent = d.to || '';
  document.getElementById('cardText').textContent = d.text || '';
  document.getElementById('cardFrom').textContent = d.from || '';

  if (d.photo) {
    document.getElementById('cardPhoto').src = d.photo;
    document.getElementById('photoSection').classList.add('has-photo');
  }

  if (d.songData && d.songTitle) {
    document.getElementById('songTitleDisplay').textContent = d.songTitle;
    document.getElementById('audioPlayer').src = d.songData;
    document.getElementById('musicSection').classList.add('visible');
  }
}

// ===== AUDIO PLAYER =====
let playing = false;
function togglePlay() {
  const audio = document.getElementById('audioPlayer');
  if (playing) {
    audio.pause(); playing = false;
    document.getElementById('playIcon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
  } else {
    audio.play().catch(e => {});
    playing = true;
    document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  }
}
function resetPlay() {
  playing = false;
  document.getElementById('playIcon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('songTime').textContent = '0:00';
}
function updateProgress() {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;
  document.getElementById('progressBar').style.width = (audio.currentTime/audio.duration*100)+'%';
  const m = Math.floor(audio.currentTime/60);
  const s = Math.floor(audio.currentTime%60).toString().padStart(2,'0');
  document.getElementById('songTime').textContent = m+':'+s;
}
function seekAudio(e) {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX-rect.left)/rect.width)*audio.duration;
}
</script>
</body>
</html>
